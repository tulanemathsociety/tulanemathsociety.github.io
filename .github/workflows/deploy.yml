name: Deploy site

# GitHub Pages for this repo is set to "Deploy from a branch: main / (root)",
# and only the account that owns the repo can change that. So this workflow does
# not push to gh-pages. It builds the Jekyll site in src/ and commits the result
# to the root of main, which is what Pages actually serves.
#
# If Pages is ever repointed at a gh-pages branch, replace the commit step with
# JamesIves/github-pages-deploy-action and move src/* back to the root.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the run triggered by this workflow's own publish commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
          working-directory: src

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install JS deps 📦
        run: npm ci
        working-directory: src

      - name: Build and stage the site 🔧
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install -g purgecss
          bin/publish

      - name: Commit the built site to main 🚀
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish site [skip ci]"
          git push
